# market-service: a Deployment (runs the container) and a Service (fixed name "market-service").
# Apply with:  kubectl apply -f k8s/market-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
spec:
  replicas: 1   # keep 1: every copy would generate its own prices into the same table
  selector:
    matchLabels:
      app: market-service
  template:
    metadata:
      labels:
        app: market-service
    spec:
      containers:
        - name: market-service
          image: market-service:1.0
          imagePullPolicy: IfNotPresent   # use the image built on this machine, don't pull from the internet
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/cloudtrader   # "mysql" = the headless Service name
            - name: DB_USER
              value: trader
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
          # Only receive traffic once the app is up and can reach the database
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
---
# Other pods reach this service at http://market-service:8081
apiVersion: v1
kind: Service
metadata:
  name: market-service
spec:
  selector:
    app: market-service
  ports:
    - port: 8081
      targetPort: 8081
