spring.application.name=portfolio-service
server.port=8082

# Database connection (Kubernetes overrides these with environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloudtrader}
spring.datasource.username=${DB_USER:trader}
spring.datasource.password=${DB_PASSWORD:trader123}
spring.sql.init.mode=always

# Where market-service lives. Locally it's localhost; inside Kubernetes it's the service name.
market.url=${MARKET_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health
server.error.include-message=always
