spring.application.name=market-service
server.port=8081

# Database connection. Each value can be overridden by an environment variable
# (Kubernetes sets DB_URL, DB_USER, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloudtrader}
spring.datasource.username=${DB_USER:trader}
spring.datasource.password=${DB_PASSWORD:trader123}

# Run schema.sql on startup to create the table if it is missing
spring.sql.init.mode=always

# Which stocks to simulate, and their starting prices
market.symbols=AAPL,GOOGL,MSFT,TSLA,AMZN
market.start-prices=190.00,170.00,420.00,250.00,185.00

# Data retention: keep only the newest N price rows
market.retention.enabled=${RETENTION_ENABLED:true}
market.retention.max-rows=${RETENTION_MAX_ROWS:50000}

# Only expose the health endpoint
management.endpoints.web.exposure.include=health
server.error.include-message=always
